
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGQ - Sistema de Gestão da Qualidade</title>
    <meta name="description" content="Sistema de Gestão da Qualidade Via Néctare">
    <meta name="theme-color" content="#1A2B34">
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="./gota.png" sizes="192x192">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.ico">
    <link rel="shortcut icon" type="image/png" href="./favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
          width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #E3851B;
          border-radius: 10px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-scaleIn { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

        /* --- SISTEMA DE IMPRESSÃO OTIMIZADO --- */
        @media print {
            /* 1. Ocultar tudo que não for o conteúdo de impressão */
            body * {
                visibility: hidden !important;
            }
            
            /* 2. Tornar o container do relatório e seus filhos visíveis */
            .print-content, .print-content * {
                visibility: visible !important;
            }

            /* 3. Posicionar o conteúdo no topo da página e remover fundos */
            .print-content {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                box-shadow: none !important;
                display: block !important;
            }

            /* 4. Garantir que o modal não tenha fundo escuro na impressão */
            .fixed.inset-0 {
                background: white !important;
                position: absolute !important;
            }

            /* 5. Ocultar especificamente botões e elementos indesejados */
            .no-print, button, nav, header {
                display: none !important;
            }

            /* 6. Ajuste de Escala para A4 */
            html, body {
                background: white !important;
                width: 210mm;
            }
            
            .print-content {
                zoom: 90%;
            }

            /* 7. Remove scrollbars na impressão */
            .custom-scrollbar {
                overflow: visible !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
